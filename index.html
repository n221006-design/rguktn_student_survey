<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGUKT Student Survey</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6ff;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 750px;
    margin: auto;
    padding: 20px;
}

h2 {
    text-align: center;
}

form {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
    box-sizing: border-box;
}

button {
    margin-top: 20px;
    padding: 10px;
    width: 100%;
    background: #5b6cff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

#freeze,
#birthday,
#video {
    display: none;
    text-align: center;
    padding: 30px;
}

#msg {
    font-size: 22px;
    white-space: pre-line;
    line-height: 1.8;
    text-align: center;
    font-weight: 500;
}

#continueBtn {
    display: none;
    margin-top: 30px;
    padding: 12px;
    background: #ff4d6d;
    border: none;
    color: white;
    border-radius: 8px;
    width: 100%;
    font-size: 16px;
}

#freeze h2 {
    margin-top: 100px;
}

#freeze p {
    font-size: 18px;
}
</style>
</head>

<body>

<div class="container">

<!-- FORM -->
<div id="form">
<h2>RGUKT NUZVID ENGINEERING STUDENTS SURVEY</h2>

<form>

<label>1. Full Name</label>
<input type="text">

<label>2. Age</label>
<input type="number">

<label>3. Gender</label>
<select>
<option>Male</option>
<option>Female</option>
<option>Prefer not to say</option>
</select>

<label>4. College Name</label>
<input type="text">

<label>5. Department / Branch</label>
<input type="text">

<label>6. Year of Study</label>
<select>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>

<label>7. Semester</label>
<input type="text">

<label>8. Student ID (Optional)</label>
<input type="text">

<label>9. City</label>
<input type="text">

<label>10. Email</label>
<input type="email">

<label>11. Academic Satisfaction</label>
<select>
<option>Very Satisfied</option>
<option>Satisfied</option>
<option>Neutral</option>
<option>Dissatisfied</option>
</select>

<label>12. Learning Mode</label>
<select>
<option>Classroom</option>
<option>Online</option>
<option>Self Study</option>
<option>Group Study</option>
</select>

<label>13. Study Hours per Day</label>
<select>
<option>&lt;1 hour</option>
<option>1–2 hours</option>
<option>2–4 hours</option>
<option>4+ hours</option>
</select>

<label>14. Subject Interest</label>
<select>
<option>Technical</option>
<option>Theoretical</option>
<option>Practical</option>
<option>Research</option>
</select>

<label>15. Extracurricular Activities</label>
<select>
<option>Yes</option>
<option>No</option>
</select>

<label>16. Support Needed</label>
<select>
<option>Career Guidance</option>
<option>Skill Development</option>
<option>Placement Preparation</option>
<option>Higher Studies</option>
</select>

<label>17. Confidence Level</label>
<select>
<option>Very Confident</option>
<option>Confident</option>
<option>Neutral</option>
<option>Low</option>
</select>

<label>18. Time Management (1–10)</label>
<select>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
</select>

<label>19. Internship Interest</label>
<select>
<option>High</option>
<option>Medium</option>
<option>Low</option>
</select>

<label>20. Suggestions for Improvement</label>
<textarea rows="4"></textarea>

<button type="submit">Submit</button>

</form>
</div>

<!-- FREEZE SCREEN -->
<div id="freeze">
<h2>⏳ Taking responses...</h2>
<p>Please wait...</p>
<p>Processing survey data...</p>
</div>

<!-- BIRTHDAY MESSAGE -->
<div id="birthday">
<div id="msg"></div>
<button id="continueBtn">Continue 💖</button>
</div>

<!-- VIDEO -->
<div id="video">
<h2>💖 For You</h2>

<video width="100%" controls>
<source src="video_20260612_182916.mp4" type="video/mp4">
</video>

</div>

</div>

<script>

const form = document.getElementById("form");
const freeze = document.getElementById("freeze");
const birthday = document.getElementById("birthday");
const msg = document.getElementById("msg");
const video = document.getElementById("video");
const btn = document.getElementById("continueBtn");

const text =
`If distance didn't exist, I'd be celebrating this day beside you.

Long before I was born, this world had already received my soul.

MUDDHULA MOGUDIKI HAPPIEST BIRTHDAYYYYYY🙈❤️🫴

I LOVE YOU SO MUCH NANNA 🫀🥀`;

function typeWriter(i = 0) {

    if (i < text.length) {

        msg.innerHTML += text.charAt(i);

        setTimeout(() => {
            typeWriter(i + 1);
        }, 200);

    } else {

        btn.style.display = "block";
    }
}

btn.addEventListener("click", () => {

    birthday.style.display = "none";
    video.style.display = "block";
});

function checkTime() {

    const d = new Date();

    const h = d.getHours();
    const m = d.getMinutes();
    const s = d.getSeconds();

    if (h === 23 && m === 59 && s >= 30) {

        form.style.display = "none";
        freeze.style.display = "block";
        birthday.style.display = "none";
        video.style.display = "none";
    }

    if (h === 0 && m === 0) {

        form.style.display = "none";
        freeze.style.display = "none";
        birthday.style.display = "block";

        if (msg.innerHTML === "") {
            typeWriter();
        }
    }
}

checkTime();

setInterval(checkTime, 1000);

</script>

</body>
</html>
