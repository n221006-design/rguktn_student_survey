<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGUKT Student Survey</title>

<style>
body {
    font-family: Arial;
    background: #f4f6ff;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

h2 { text-align: center; }

form {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    margin-top: 20px;
    padding: 10px;
    width: 100%;
    background: #5b6cff;
    color: white;
    border: none;
    border-radius: 5px;
}

#freeze, #birthday, #video {
    display: none;
    text-align: center;
    padding: 30px;
}

#msg {
    font-size: 22px;
    white-space: pre-line;
}

#continueBtn {
    display: none;
    margin-top: 20px;
    padding: 12px;
    background: #ff4d6d;
    border: none;
    color: white;
    border-radius: 8px;
    width: 100%;
}
</style>
</head>

<body>

<div class="container">

<div id="form">
<h2>Student Survey Form</h2>

<form>
<label>1. Full Name</label><input type="text">
<label>2. Age</label><input type="number">

<label>3. Gender</label>
<select>
<option>Male</option>
<option>Female</option>
<option>Prefer not to say</option>
</select>

<label>4. College Name</label><input type="text">
<label>5. Department / Branch</label><input type="text">

<label>6. Year</label>
<select>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>

<label>7. Email</label><input type="email">

<label>8. Satisfaction</label>
<select>
<option>Very Satisfied</option>
<option>Satisfied</option>
<option>Neutral</option>
<option>Dissatisfied</option>
</select>

<label>9. Study Hours</label>
<select>
<option>1–2</option>
<option>2–4</option>
<option>4+</option>
</select>

<label>10. Feedback</label>
<textarea></textarea>

<button type="submit">Submit</button>
</form>
</div>

<div id="freeze">
<h2>⏳ Taking responses...</h2>
</div>

<div id="birthday">
<div id="msg"></div>
<button id="continueBtn">Continue 💖</button>
</div>

<div id="video">
<h2>💖 For You</h2>
<video width="100%" controls>
<source src="video_20260612_182916.mp4" type="video/mp4">
</video>
</div>

</div>

<script>

const form = document.getElementById("form");
const freeze = document.getElementById("freeze");
const birthday = document.getElementById("birthday");
const msg = document.getElementById("msg");
const video = document.getElementById("video");
const btn = document.getElementById("continueBtn");

const text =
`If distance didn't exist, I'd be celebrating this day beside you.
Long before I was born, this world had already received my soul.
Muddula mogudiki Happiest Birthday 🙈❤️🫴`;

let started = false;

/* FIXED TYPEWRITER */
function typeWriter(i = 0) {
    if (i < text.length) {
        msg.innerHTML += text[i];
        setTimeout(() => typeWriter(i + 1), 60);
    } else {
        btn.style.display = "block"; // ALWAYS TRIGGERS
    }
}

/* FIXED TIME LOGIC */
function checkTime() {
    const d = new Date();
    const h = d.getHours();
    const m = d.getMinutes();

    // Freeze BEFORE midnight safely
    if (h === 23 && m === 59) {
        form.style.display = "none";
        freeze.style.display = "block";
    }

    // ANY TIME AFTER MIDNIGHT (FIXED BUG)
    if (h === 0 && !started) {
        started = true;
        form.style.display = "none";
        freeze.style.display = "none";
        birthday.style.display = "block";
        typeWriter();
    }
}

setInterval(checkTime, 1000);

/* BUTTON CLICK */
btn.addEventListener("click", () => {
    birthday.style.display = "none";
    video.style.display = "block";
});

</script>

</body>
</html>
